name: CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "release/**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  # ---------------------------------------------------------------
  # シークレット漏洩スキャン
  # ---------------------------------------------------------------
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-secrets
        run: |
          git clone --branch 1.3.0 --depth 1 --single-branch https://github.com/awslabs/git-secrets.git /tmp/git-secrets
          cd /tmp/git-secrets && sudo make install

      - name: Verify custom git-secrets patterns
        run: |
          .github/scripts/verify-git-secrets-patterns.sh

      - name: Register git-secrets patterns
        run: |
          .github/scripts/register-git-secrets-patterns.sh

      - name: Scan repository for secrets
        run: |
          git secrets --scan-history

  # ---------------------------------------------------------------
  # フロントエンド
  # ---------------------------------------------------------------
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc -b --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # ---------------------------------------------------------------
  # BFF
  # ---------------------------------------------------------------
  bff:
    name: BFF
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: bff/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      # BFF は production TypeScript を持つため、type-check と test に加えて lint も gate にする。
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  # ---------------------------------------------------------------
  # バックエンド
  # ---------------------------------------------------------------
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_blog_service
          MYSQL_USER: blog_service
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, mbstring, dom, fileinfo, pcntl, bcmath
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Set test environment variables
        run: |
          echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV
          echo "DB_PORT=3306" >> $GITHUB_ENV
          echo "DB_DATABASE=test_blog_service" >> $GITHUB_ENV
          echo "DB_USERNAME=blog_service" >> $GITHUB_ENV
          echo "DB_PASSWORD=secret" >> $GITHUB_ENV

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests (Pest)
        run: php artisan test

      - name: Lint (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan / Larastan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  # ---------------------------------------------------------------
  # E2E
  # ---------------------------------------------------------------
  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    needs:
      - frontend
      - bff
      - backend

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install E2E dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm e2e:install

      - name: Prepare backend environment
        run: |
          cp backend/.env.example backend/.env
          sed -i 's/^APP_URL=.*/APP_URL=http:\/\/localhost:8080/' backend/.env
          sed -i 's/^JWT_SIGNING_SECRET=.*/JWT_SIGNING_SECRET=ci-blog-service-e2e-jwt-secret/' backend/.env
          sed -i 's/^DB_HOST=.*/DB_HOST=db/' backend/.env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' backend/.env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=blog_service/' backend/.env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=blog_service/' backend/.env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=secret/' backend/.env

      - name: Start Docker services
        run: docker compose up -d db redis backend-php backend-nginx bff frontend

      - name: Install backend dependencies
        run: docker compose exec -T backend-php composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: docker compose exec -T backend-php php artisan key:generate

      - name: Run migrations
        run: |
          for i in {1..30}; do
            docker compose exec -T backend-php php artisan migrate:fresh --force && exit 0
            sleep 2
          done

          docker compose logs --tail=200 db backend-php backend-nginx
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:3005 >/dev/null && exit 0
            sleep 2
          done

          docker compose logs --tail=200 frontend bff backend-nginx
          exit 1

      - name: Run E2E smoke
        run: pnpm e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Print Docker logs
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop Docker services
        if: always()
        run: docker compose down -v
