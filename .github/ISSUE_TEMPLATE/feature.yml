name: Feature / Implementation
description: API、CRUD、画面、ドメイン実装のIssue
title: "feat: "
labels:
  - "type: feature"
  - "status: needs discussion"
body:
  - type: markdown
    attributes:
      value: |
        実装前に `specs/_template-feature-spec.md` を使い、`specs/` 配下へ設計メモを作成します。
        Label の分類と付け方は `docs/labels.md` を確認してください。

  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 実装する機能をユーザー視点で記述してください。
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 背景
      description: なぜこの機能が必要か、どの要件に対応するかを記述してください。
      placeholder: "`docs/requirements.md` の認証要件に対応する。"
    validations:
      required: true

  - type: dropdown
    id: layers
    attributes:
      label: 対象レイヤー
      description: 主な変更対象を選択してください。複数ある場合は本文に補足してください。
      options:
        - backend
        - frontend
        - frontend + backend
        - docs / planning
        - infra
    validations:
      required: true

  - type: textarea
    id: project
    attributes:
      label: Project / Epic
      description: GitHub Projects の Epic field、親Issue、sub-issue候補を記述してください。
      value: |
        Epic: <Backend Foundation / Frontend Foundation / Identity Context / Publishing Context / Social Context / API Integration / E2E / Quality>
        Parent: #
        Sub-issue分解:
        - [ ] 不要
        - [ ] 必要（候補を下に記述）
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: 要件
      description: 必要な振る舞い、API、画面、認可、バリデーションを記述してください。
      value: |
        - <要件>
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: 完了と言える条件をチェックリストで記述してください。
      value: |
        - [ ] <条件>
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: テスト観点
      description: 追加・更新すべきテストや確認観点を記述してください。
      value: |
        - [ ] 正常系
        - [ ] 異常系
        - [ ] 認可
        - [ ] バリデーション
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 関連
      description: 親Issue、関連Issue、参考URLがあれば記述してください。
      placeholder: "Parent: #"
