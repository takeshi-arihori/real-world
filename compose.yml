services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-real_world}"
      MYSQL_USER: "${DB_USERNAME:-real_world}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  api-php:
    build:
      context: ./docker/api/php
      dockerfile: Dockerfile
    volumes:
      - ./api:/var/www/html
    environment:
      XDEBUG_MODE: "off"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  api-nginx:
    build:
      context: ./docker/api/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
    depends_on:
      - api-php
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

  web:
    build:
      context: ./docker/web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    networks:
      - app-network

volumes:
  db-data:
  web-node-modules:

networks:
  app-network:
    driver: bridge
