name: blog-service

services:
  db:
    build:
      context: ./docker/db
      dockerfile: Dockerfile
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret}"
      MYSQL_DATABASE: "${DB_DATABASE:-blog_service}"
      MYSQL_USER: "${DB_USERNAME:-blog_service}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network

  backend-php:
    build:
      context: ./docker/backend/php
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
    environment:
      XDEBUG_MODE: "off"
      XDEBUG_START_WITH_REQUEST: "trigger"
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network

  backend-nginx:
    build:
      context: ./docker/backend/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - backend-php
    networks:
      - app-network

  # BFF の BrowserSession を共有し、TTL による session expiry を Redis 側で管理する。
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  bff:
    build:
      context: ./docker/bff
      dockerfile: Dockerfile
    ports:
      - "3006:3006"
    volumes:
      - ./bff:/app
      - bff-node-modules:/app/node_modules
    environment:
      PORT: "3006"
      PUBLIC_API_BASE_URL: "http://backend-nginx"
      # browser cookie には opaque id だけを保持し、session state は Redis に保存する。
      BFF_REDIS_URL: "redis://redis:6379"
      BFF_SESSION_COOKIE_NAME: "__Host-blog_service_session"
      BFF_SESSION_KEY_PREFIX: "${BFF_SESSION_KEY_PREFIX:-bff:session:}"
      BFF_SESSION_TTL_SECONDS: "${BFF_SESSION_TTL_SECONDS:-3600}"
    depends_on:
      backend-nginx:
        condition: service_started
      # Redis session store に接続できる状態で BFF を起動する。
      redis:
        condition: service_healthy
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      BFF_PROXY_TARGET: "http://bff:3006"
    depends_on:
      - bff
    networks:
      - app-network

volumes:
  db-data:
  frontend-node-modules:
  bff-node-modules:
  redis-data:

networks:
  app-network:
    driver: bridge
