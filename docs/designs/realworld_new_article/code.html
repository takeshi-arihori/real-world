<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col selection:bg-primary-fixed-dim selection:text-on-primary-fixed">
<!-- TopNavBar -->
<nav class="bg-surface dark:bg-background docked full-width top-0 sticky border-b border-surface-container-highest dark:border-outline-variant z-50">
<div class="flex justify-between items-center w-full px-margin-mobile md:px-gutter max-w-container-max mx-auto h-16">
<a class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary-fixed" href="/">RealWorld</a>
<div class="flex items-center gap-stack-lg">
<ul class="hidden md:flex items-center gap-stack-lg">
<li>
<a class="font-ui-label text-ui-label text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed transition-colors" href="/">Home</a>
</li>
<li>

<a class="font-ui-label text-ui-label text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed transition-colors" href="/settings">Settings</a>
</li>
</ul>
<a class="flex items-center gap-2 font-ui-label text-ui-label text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed transition-colors" href="/profile">

</a>
</div>
</div>

<!-- Main Editor Canvas -->
<main class="flex-grow w-full py-stack-xl px-margin-mobile md:px-0">
<form class="max-w-reading-column-max mx-auto flex flex-col gap-stack-xl">
<!-- Article Title -->
<div class="w-full">
<input class="w-full bg-transparent border border-transparent border-b-surface-container-highest focus:border-primary-container focus:rounded focus:bg-surface px-3 py-4 font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface placeholder-secondary-fixed-dim transition-all" placeholder="Article Title" type="text"/>
</div>
<!-- Description -->
<div class="w-full">
<input class="w-full bg-transparent border border-transparent border-b-surface-container-highest focus:border-primary-container focus:rounded focus:bg-surface px-3 py-3 font-body-md text-body-md text-on-surface placeholder-secondary transition-all" placeholder="What's this article about?" type="text"/>
</div>
<!-- Body -->
<div class="w-full flex-grow">
<textarea class="w-full min-h-[400px] bg-transparent border border-transparent border-b-surface-container-highest focus:border-primary-container focus:rounded focus:bg-surface px-3 py-4 font-body-lg text-body-lg text-on-surface placeholder-secondary resize-y transition-all" placeholder="Write your article (in markdown)" rows="16"></textarea>
</div>
<!-- Tags -->
<div class="w-full">
<input class="w-full bg-transparent border border-transparent border-b-surface-container-highest focus:border-primary-container focus:rounded focus:bg-surface px-3 py-3 font-body-md text-body-md text-on-surface placeholder-secondary transition-all" placeholder="Enter tags" type="text"/>
</div>
<!-- Actions -->
<div class="w-full flex justify-end pt-stack-sm pb-stack-xl">
<button class="bg-primary-container text-on-primary font-ui-button text-ui-button px-8 py-4 rounded shadow-[0_4px_16px_rgba(92,184,92,0.15)] hover:bg-[#4cae4c] hover:shadow-[0_6px_24px_rgba(92,184,92,0.25)] transition-all active:scale-[0.98]" type="button">
          Publish Article
        </button>
</div>
</form>
</main>
<!-- Footer -->
<footer class="bg-surface-container-low dark:bg-surface-dim full-width border-t border-surface-container-highest dark:border-outline-variant mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center w-full px-margin-mobile py-stack-lg max-w-container-max mx-auto gap-stack-md">

</li>
</ul>
</div>
</footer>
