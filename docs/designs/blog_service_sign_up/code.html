<body class="bg-background text-on-background min-h-screen flex flex-col">

</div>
<form action="#" class="w-full flex flex-col gap-stack-md" method="POST">
<div class="relative">
<input class="w-full bg-surface border-0 border-b border-surface-container-highest focus:ring-0 focus:border-primary-container focus:border focus:rounded-[4px] px-0 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-secondary-fixed-dim transition-all duration-200 outline-none" id="username" name="username" placeholder="Username" required="" type="text"/>
</div>
<div class="relative">
<input class="w-full bg-surface border-0 border-b border-surface-container-highest focus:ring-0 focus:border-primary-container focus:border focus:rounded-[4px] px-0 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-secondary-fixed-dim transition-all duration-200 outline-none" id="email" name="email" placeholder="Email" required="" type="email"/>
</div>
<div class="relative">
<input class="w-full bg-surface border-0 border-b border-surface-container-highest focus:ring-0 focus:border-primary-container focus:border focus:rounded-[4px] px-0 py-3 font-body-lg text-body-lg text-on-surface placeholder:text-secondary-fixed-dim transition-all duration-200 outline-none" id="password" name="password" placeholder="Password" required="" type="password"/>
</div>
<div class="flex justify-end mt-stack-md">
<button class="bg-primary-container text-on-primary font-ui-button text-ui-button py-3 px-8 rounded-lg shadow-[0_4px_14px_rgba(92,184,92,0.25)] hover:bg-surface-tint hover:shadow-[0_6px_20px_rgba(92,184,92,0.35)] transition-all duration-200" type="submit">

</div>
