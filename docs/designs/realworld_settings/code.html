<h1 class="font-headline-md text-headline-md text-center mb-stack-lg">Your Settings</h1>
<form class="flex flex-col gap-stack-md w-full">
<!-- URL for profile picture -->
<div>
<input class="w-full bg-transparent border-0 border-b border-surface-container-highest px-0 py-3 font-body-md text-body-md text-on-surface placeholder-secondary focus:ring-0 focus:border-b focus:border-primary-container focus:rounded transition-all" placeholder="URL of profile picture" type="text"/>
</div>
<!-- Username -->
<div>
<input class="w-full bg-transparent border-0 border-b border-surface-container-highest px-0 py-3 font-headline-sm text-headline-sm text-on-surface placeholder-secondary focus:ring-0 focus:border-b focus:border-primary-container focus:rounded transition-all" placeholder="Username" type="text"/>
</div>
<!-- Short bio -->
<div>
<textarea class="w-full bg-transparent border-0 border-b border-surface-container-highest px-0 py-3 font-body-md text-body-md text-on-surface placeholder-secondary focus:ring-0 focus:border-b focus:border-primary-container focus:rounded transition-all resize-none" placeholder="Short bio about you" rows="5"></textarea>
</div>
<!-- Email -->
<div>
<input class="w-full bg-transparent border-0 border-b border-surface-container-highest px-0 py-3 font-body-md text-body-md text-on-surface placeholder-secondary focus:ring-0 focus:border-b focus:border-primary-container focus:rounded transition-all" placeholder="Email" type="email"/>
</div>
<!-- New Password -->
<div>
<input class="w-full bg-transparent border-0 border-b border-surface-container-highest px-0 py-3 font-body-md text-body-md text-on-surface placeholder-secondary focus:ring-0 focus:border-b focus:border-primary-container focus:rounded transition-all" placeholder="New Password" type="password"/>
</div>

<button class="bg-primary-container text-on-primary px-8 py-3 rounded font-ui-button text-ui-button hover:opacity-90 transition-opacity shadow-[0_4px_14px_0_rgba(92,184,92,0.39)]" type="submit">
                        Update Settings
                    </button>
</div>
</form>
<div class="mt-stack-lg pt-stack-md border-t border-surface-container-highest flex justify-start">
